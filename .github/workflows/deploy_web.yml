name: Deploy Shareable Mobile Web App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🌐 Setup GitHub Pages (auto-enables if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 📦 Upload Web Preview Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web_preview'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
