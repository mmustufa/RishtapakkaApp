name: Build Android APK for WhatsApp Sharing

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Compile Release APK
        run: flutter build apk --release

      - name: 📋 Prepare APK for Distribution
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NikahBureau-Pro-Release.apk
          ls -lh dist/

      - name: 📤 Upload APK Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: NikahBureau-Pro-Release-APK
          path: dist/NikahBureau-Pro-Release.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release (Direct Downloadable Link for WhatsApp)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "NikahBureau Pro — Android APK (v1.0.0)"
          body: |
            ### 📱 Standalone Android APK for WhatsApp & Direct Distribution
            
            This APK is ready to install directly on Android phones.
            
            - **App Name:** NikahBureau Pro (Rishta Agent Manager)
            - **Build Type:** Release APK
            - **Install Guide:** Download `NikahBureau-Pro-Release.apk` and send it over WhatsApp or open directly on Android.
          files: dist/NikahBureau-Pro-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
